<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Washing Machine Body -->
  <rect x="96" y="96" width="320" height="320" rx="40" fill="#ffffff" opacity="0.95"/>
  
  <!-- Top Control Bar -->
  <circle cx="160" cy="150" r="16" fill="#0284c7"/>
  <rect x="195" y="142" width="16" height="16" rx="4" fill="#cbd5e1"/>
  <rect x="223" y="142" width="16" height="16" rx="4" fill="#cbd5e1"/>
  <rect x="295" y="138" width="75" height="24" rx="8" fill="#e0f2fe"/>
  
  <!-- Outer Door Ring -->
  <circle cx="256" cy="288" r="100" fill="url(#doorGrad)"/>
  <circle cx="256" cy="288" r="82" fill="#ffffff"/>
  
  <!-- Water & Waves inside Door -->
  <circle cx="256" cy="288" r="74" fill="url(#waterGrad)"/>
  <path d="M185 288 Q220 260 256 288 T327 288 A74 74 0 0 1 185 288 Z" fill="#ffffff" opacity="0.4"/>
  
  <!-- Bubbles -->
  <circle cx="230" cy="260" r="10" fill="#ffffff" opacity="0.85"/>
  <circle cx="270" cy="275" r="7" fill="#ffffff" opacity="0.75"/>
  <circle cx="250" cy="240" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="285" cy="250" r="8" fill="#ffffff" opacity="0.8"/>
  
  <!-- Sparkles -->
  <path d="M380 90 L385 105 L400 110 L385 115 L380 130 L375 115 L360 110 L375 105 Z" fill="#fef08a"/>
  <path d="M120 380 L123 390 L133 393 L123 396 L120 406 L117 396 L107 393 L117 390 Z" fill="#ffffff" opacity="0.9"/>
</svg>
