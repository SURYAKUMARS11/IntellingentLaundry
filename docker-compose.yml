version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: laundry_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laundry_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/laundry_db
      - JWT_SECRET=laundry_shop_super_secret_jwt_key_2026
      - NODE_ENV=production
    depends_on:
      - mongodb

volumes:
  mongo_data:
